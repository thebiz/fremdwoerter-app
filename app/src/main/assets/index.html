<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fremdwörter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view"></main>

  <button id="fab" class="fab" data-act="new" aria-label="Neues Wort">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabs" id="tabs">
    <button data-tab="list">
      <svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.4 4 4.7v12.8c3-.3 6 .3 8 1.8m0-12.8c2-1.5 5-2.1 8-1.8v12.8c-3-.3-6 .3-8 1.8m0-12.8v12.8"/></svg>
      <span>Wörter</span>
    </button>
    <button data-tab="quiz">
      <svg viewBox="0 0 24 24"><path d="M6.5 8h11v11h-11z M9.5 5h11v11"/></svg>
      <span>Abfrage</span>
    </button>
    <button data-tab="more">
      <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
      <span>Mehr</span>
    </button>
  </nav>

  <div id="layer"></div>
  <div id="toast"></div>

  <script src="wiki.js"></script>
  <script src="app.js"></script>
</body>
</html>
