name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk fremdwoerter.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Fremdwörter 0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: fremdwoerter.apk
          make_latest: true
